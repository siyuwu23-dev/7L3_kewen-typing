<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课文打字游戏：游香港</title>
    <!-- 引入 pinyin-pro 库自动生成拼音 -->
    <script src="https://unpkg.com/pinyin-pro"></script>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #game-container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 80%;
            max-width: 900px;
            padding: 30px;
            position: relative;
        }
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        #progress {
            font-size: 18px;
            font-weight: bold;
            color: #555;
        }
        #hearts {
            font-size: 24px;
        }
        .heart {
            color: red;
            margin-left: 5px;
            transition: opacity 0.3s;
        }
        .heart.used {
            opacity: 0.2;
        }
        #text-display {
            min-height: 120px;
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 30px;
            line-height: 2;
        }
        .char-box {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin: 0 3px;
            cursor: pointer;
            user-select: none;
        }
        .pinyin {
            font-size: 16px;
            color: #007BFF;
            height: 22px;
            visibility: hidden;
        }
        .pinyin.show {
            visibility: visible;
        }
        .hanzi {
            font-size: 32px;
            color: black;
            transition: color 0.2s;
            font-weight: 500;
        }
        .hanzi.typed {
            color: red;
        }
        #input-container {
            text-align: center;
        }
        input[type="text"] {
            width: 90%;
            font-size: 24px;
            padding: 10px 15px;
            border: 2px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #007BFF;
        }
        #next-btn {
            display: none;
            margin: 20px auto 0;
            padding: 10px 30px;
            font-size: 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #next-btn:hover {
            background-color: #218838;
        }
        #completion-msg {
            display: none;
            text-align: center;
            font-size: 32px;
            color: #d81b60;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="header">
        <div id="progress">进度: 1 / 21</div>
        <div id="hearts">
            <span class="heart" id="heart-1">❤️</span>
            <span class="heart" id="heart-2">❤️</span>
            <span class="heart" id="heart-3">❤️</span>
        </div>
    </div>
    
    <div id="text-display"></div>
    
    <div id="input-container">
        <input type="text" id="user-input" autocomplete="off" placeholder="请在这里开始打字..." />
        <button id="next-btn" onclick="nextPage()">下一句</button>
    </div>

    <div id="completion-msg">🎉 恭喜你，完成了《游香港》课文打字练习！</div>
</div>

<script>
    const sentences = [
        "香港是现代化的国际大都市，被称为：东方之珠。",
        "是世界著名的金融、航运中心，也是有名的旅游胜地。",
        "我外公、外婆一家就住在这里。",
        "我们到达香港的第二天，舅舅就开车带我们来到港岛的太平山上。",
        "姨妈和表妹也来了。",
        "站在山上向北望去，维多利亚港北边是九龙半岛。",
        "南边是香港岛，两岸高楼林立。",
        "香港会议展览中心就在港岛的海边上。",
        "舅舅告诉我们：一九九七年七月一日零时，就是在那儿。",
        "中英两国政府举行了香港回归中国的政权交接仪式。",
        "姨妈接着说：香港现在是中国的一个特别行政区，实行‘一国两制’。",
        "香港人有信心把香港建设得更美好。",
        "这时，表妹一手拿着望远镜，一手指着前边。",
        "对我说：你看见没有？那儿有一面五星红旗。",
        "我接过望远镜，顺着表妹指的方向望去。",
        "只见远处有一面五星红旗在迎风飘扬。",
        "从太平山下来，舅舅又开车带我们在市区观光。",
        "街上车水马龙，人来人往，一片繁忙景象。",
        "晚饭后，我们开车来到九龙。",
        "在海边向对岸望去，港岛上灯火通明。",
        "五颜六色的彩灯倒映在水中，显得更加美丽，更加迷人。"
    ];

    let currentIndex = 0;
    let heartsLeft = 3;
    const { pinyin } = pinyinPro;

    function initPage() {
        if (currentIndex >= sentences.length) {
            document.getElementById('header').style.display = 'none';
            document.getElementById('text-display').style.display = 'none';
            document.getElementById('input-container').style.display = 'none';
            document.getElementById('completion-msg').style.display = 'block';
            return;
        }

        heartsLeft = 3;
        updateHeartsUI();
        document.getElementById('progress').innerText = `进度: ${currentIndex + 1} / ${sentences.length}`;
        
        const display = document.getElementById('text-display');
        display.innerHTML = '';
        
        const inputField = document.getElementById('user-input');
        inputField.value = '';
        inputField.disabled = false;
        inputField.focus();
        
        document.getElementById('next-btn').style.display = 'none';

        const sentence = sentences[currentIndex];
        
        for (let i = 0; i < sentence.length; i++) {
            const char = sentence[i];
            let py = pinyin(char, { toneType: 'symbol' });
            
            const isPunctuation = (py === char || /^[A-Za-z0-9\s]+$/.test(char) || /[，。！？：；‘’“”（）【】《》]/.test(char));

            const charBox = document.createElement('div');
            charBox.className = 'char-box';

            const pySpan = document.createElement('div');
            pySpan.className = 'pinyin';
            pySpan.innerText = isPunctuation ? '' : py;

            const hzSpan = document.createElement('div');
            hzSpan.className = 'hanzi';
            hzSpan.innerText = char;
            hzSpan.id = `char-${i}`;

            charBox.onclick = () => {
                if (!isPunctuation && !pySpan.classList.contains('show')) {
                    if (heartsLeft > 0) {
                        heartsLeft--;
                        updateHeartsUI();
                        pySpan.classList.add('show');
                    } else {
                        alert("这一页的提示次数用完啦！");
                    }
                }
            };

            charBox.appendChild(pySpan);
            charBox.appendChild(hzSpan);
            display.appendChild(charBox);
        }
    }

    function updateHeartsUI() {
        for (let i = 1; i <= 3; i++) {
            const heart = document.getElementById(`heart-${i}`);
            if (i <= heartsLeft) {
                heart.classList.remove('used');
            } else {
                heart.classList.add('used');
            }
        }
    }

    document.getElementById('user-input').addEventListener('input', (e) => {
        const inputVal = e.target.value;
        const sentence = sentences[currentIndex];
        let isComplete = false;

        for (let i = 0; i < sentence.length; i++) {
            const hzSpan = document.getElementById(`char-${i}`);
            if (i < inputVal.length) {
                if (inputVal[i] === sentence[i]) {
                    hzSpan.classList.add('typed');
                } else {
                    hzSpan.classList.remove('typed');
                }
            } else {
                hzSpan.classList.remove('typed');
            }
        }

        if (inputVal === sentence) {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('user-input').disabled = true;
        } else {
            document.getElementById('next-btn').style.display = 'none';
        }
    });

    function nextPage() {
        currentIndex++;
        initPage();
    }

    window.onload = initPage;
</script>

</body>
</html>
